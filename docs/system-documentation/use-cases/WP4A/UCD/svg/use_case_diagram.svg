    <text x="-70" y="92">MAINTENANCE_SUPERVISOR</text>
  </g>

  <ellipse class="usecase" cx="535" cy="100" rx="165" ry="24"/>
  <text x="425" y="105">Create Maintenance Template (US115b)</text>
  <ellipse class="usecase" cx="535" cy="150" rx="165" ry="24"/>
  <text x="430" y="155">Create Maintenance Record (US115a)</text>
