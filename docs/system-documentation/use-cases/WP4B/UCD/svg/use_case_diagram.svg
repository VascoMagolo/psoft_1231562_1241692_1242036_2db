    <text x="-70" y="92">MAINTENANCE_SUPERVISOR</text>
  </g>

  <ellipse class="usecase" cx="500" cy="105" rx="165" ry="28"/>
  <text x="385" y="102">US217 - Categorize Maintenance</text><text x="430" y="119">Records by Component</text>
  <ellipse class="usecase" cx="500" cy="165" rx="145" ry="28"/>
