<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420">
  <style>
    text { font-family: Arial, sans-serif; font-size: 14px; fill: #111; }
    .title { font-weight: 700; font-size: 16px; }
    .box, .usecase { fill: #fff; stroke: #111; stroke-width: 1.5; }
    .actor line, .actor circle { stroke: #111; stroke-width: 1.5; fill: none; }
    .link { stroke: #111; stroke-width: 1.3; fill: none; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/>
    </marker>
  </defs>
  <rect class="box" x="250" y="30" width="480" height="350" rx="2"/>
  <text class="title" x="410" y="58">WP4B - Maintenance Analytics</text>

  <g class="actor" transform="translate(70 80)">
    <circle cx="0" cy="0" r="10"/><line x1="0" y1="10" x2="0" y2="45"/><line x1="-20" y1="25" x2="20" y2="25"/><line x1="0" y1="45" x2="-18" y2="70"/><line x1="0" y1="45" x2="18" y2="70"/>
