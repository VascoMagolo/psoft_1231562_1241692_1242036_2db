spring.application.name=login
spring.profiles.active=jpa
server.port=${PORT:8085}

# Instance identity. One login runs on each node; every one holds a copy of every account.
aisafe.node.id=${NODE_ID:local}
aisafe.peers=${PEERS:}
# Only this login creates the sample users; empty means every login does (local development).
aisafe.bootstrap.seed-node=${SEED_NODE:}
# On shutdown, refuse new requests for this long before stopping, so the entries send them
# elsewhere (0 = stop at once, for local development and tests).
aisafe.shutdown.drain-ms=${DRAIN_MS:0}

# JWT signing secret shared with the other services. The default is for local development
# only; in k3s it comes from the aisafe-jwt Secret.
security.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
security.jwt.expiration-ms=86400000

spring.datasource.url=${DB_URL:jdbc:h2:mem:login}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=admin
spring.datasource.password=admin
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# The structure of the database comes from the files in db/migration (Flyway), applied once and in
# order; Hibernate only checks that it matches the entities. A change to an entity needs a new file.
spring.jpa.hibernate.ddl-auto=validate
# A database created before Flyway (by Hibernate) is taken as being at version 1.
spring.flyway.baseline-on-migrate=true
spring.jpa.show-sql=false

springdoc.swagger-ui.operations-sorter=alpha

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Assignment 2: events, read models and commands on RabbitMQ (aisafe.shared.infrastructure.messaging
# and .readmodel in common). Off by default: the Assignment 1 deployment has no broker. While off,
# nothing connects to RabbitMQ and its health check is left out, so the replica still reports ready.
aisafe.events.enabled=${EVENTS_ENABLED:false}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
management.health.rabbit.enabled=${aisafe.events.enabled}
# The outbox removes an event only once the broker confirms it (publisher confirms).
spring.rabbitmq.publisher-confirm-type=simple
# A message that cannot be handled goes to this service's dead-letter queue instead of being retried forever.
spring.rabbitmq.listener.simple.default-requeue-rejected=false
# A broker or a consumer that dies (a VM lost) is noticed in about 20 s instead of 2 minutes, and a
# consumer holds one message at a time, so a dead one keeps at most one command from the others.
spring.rabbitmq.requested-heartbeat=10s
spring.rabbitmq.connection-timeout=5s
spring.rabbitmq.listener.simple.prefetch=1
# A command (request/reply) not answered in this time is given up, and expires in the queue.
aisafe.commands.timeout-ms=${COMMAND_TIMEOUT_MS:5000}

server.forward-headers-strategy=framework
logging.pattern.level=%5p [%X{nodeId:-},%X{correlationId:-}]
