spring.application.name=airports-routes
spring.profiles.active=jpa
server.port=${PORT:8082}

# Replica identity and peers (comma-separated base URLs of the other replicas).
# In k3s: NODE_ID is the pod name and PEERS lists the other pods of the StatefulSet.
aisafe.node.id=${NODE_ID:local}
aisafe.peers=${PEERS:}
# Only this replica loads the seed data; empty means every replica does (local development).
aisafe.bootstrap.seed-node=${SEED_NODE:}
# On shutdown, refuse new requests for this long before stopping, so the entries send them
# elsewhere (0 = stop at once, for local development and tests).
aisafe.shutdown.drain-ms=${DRAIN_MS:0}

# JWT signing secret shared with the login service. The default is for local development
# only; in k3s it comes from the aisafe-jwt Secret.
security.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

# Each replica has its own database. In k3s: an H2 file on the pod's disk.
spring.datasource.url=${DB_URL:jdbc:h2:mem:airportsroutes}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=admin
spring.datasource.password=admin
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# The structure of the database comes from the files in db/migration (Flyway), applied once and in
# order; Hibernate only checks that it matches the entities. A change to an entity needs a new file.
spring.jpa.hibernate.ddl-auto=validate
# A database created before Flyway (by Hibernate) is taken as being at version 1.
spring.flyway.baseline-on-migrate=true
spring.jpa.show-sql=false

springdoc.swagger-ui.operations-sorter=alpha

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# aircraft-maintenance, asked about aircraft (C1) and aircraft models (C3). In k3s: the entry of
# the same VM, which picks a ready replica and repeats the request on another one if it fails.
aisafe.services.aircraft-maintenance.url=${AIRCRAFT_MAINTENANCE_URL:http://localhost:8081}

# Assignment 2: events, read models and commands on RabbitMQ (aisafe.shared.infrastructure.messaging
# and .readmodel in common). Off by default: the Assignment 1 deployment has no broker. While off,
# nothing connects to RabbitMQ and its health check is left out, so the replica still reports ready.
aisafe.events.enabled=${EVENTS_ENABLED:false}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
management.health.rabbit.enabled=${aisafe.events.enabled}
# The outbox removes an event only once the broker confirms it (publisher confirms).
spring.rabbitmq.publisher-confirm-type=simple
# A message that cannot be handled goes to this service's dead-letter queue instead of being retried forever.
spring.rabbitmq.listener.simple.default-requeue-rejected=false
# A broker or a consumer that dies (a VM lost) is noticed in about 20 s instead of 2 minutes, and a
# consumer holds one message at a time, so a dead one keeps at most one command from the others.
spring.rabbitmq.requested-heartbeat=10s
spring.rabbitmq.connection-timeout=5s
spring.rabbitmq.listener.simple.prefetch=1
# A command (request/reply) not answered in this time is given up, and expires in the queue.
aisafe.commands.timeout-ms=${COMMAND_TIMEOUT_MS:5000}
# With events on, the listings read this replica's read model (table read_model), kept up to date
# by the events, checked against the replicas on startup and at this interval, and the entities of
# other services it reads are asked to their owner (snapshot) on startup and at the other interval.
aisafe.read-model.reconcile-interval-ms=${READ_MODEL_RECONCILE_MS:60000}
aisafe.read-model.snapshot-interval-ms=${READ_MODEL_SNAPSHOT_MS:300000}

# Links in responses use the address the client called (X-Forwarded-* headers), also when a
# peer answers a forwarded request.
server.forward-headers-strategy=framework
# Every log line shows the replica and the correlation id of the request.
logging.pattern.level=%5p [%X{nodeId:-},%X{correlationId:-}]
