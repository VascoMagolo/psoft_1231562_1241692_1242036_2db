---
# A StatefulSet, not a DaemonSet: the logins need stable names to copy the accounts between them,
# and a disk of their own. The rule below keeps one login per VM, as a DaemonSet would.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: login
  namespace: aisafe
spec:
  serviceName: login
  replicas: 3
  podManagementPolicy: Parallel
  minReadySeconds: 10
  selector:
    matchLabels:
      app: login
  template:
    metadata:
      labels:
        app: login
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: login
      tolerations:
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
      # preStop below + Spring's graceful shutdown (requests in progress finish).
      terminationGracePeriodSeconds: 25
      containers:
        - name: app
          image: "@IMAGE_PREFIX@/login:@IMAGE_TAG@"
          imagePullPolicy: "@IMAGE_PULL_POLICY@"
          ports:
            - containerPort: 8085
          env:
            - name: JAVA_TOOL_OPTIONS
              value: -Dsun.net.inetaddr.ttl=1 -Dsun.net.inetaddr.negative.ttl=0 -XX:TieredStopAtLevel=1 -Xmx320m
            - name: NODE_ID
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: PEERS
              value: >-
                http://login-0.login.aisafe.svc.cluster.local:8085,
                http://login-1.login.aisafe.svc.cluster.local:8085,
                http://login-2.login.aisafe.svc.cluster.local:8085
            - name: SEED_NODE
              value: login-0
            # Refuse new requests 3 s before stopping: the entries check readiness every second.
            - name: DRAIN_MS
              value: "3000"
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: aisafe-jwt, key: secret } }
            - name: DB_URL
              value: jdbc:h2:file:/data/login;DB_CLOSE_ON_EXIT=FALSE
            - name: AISAFE_AUDIT_FILE
              value: /data/audit.log
            # Events, read models and commands on RabbitMQ (Assignment 2), with this service's own user
            - name: EVENTS_ENABLED
              value: "true"
            - name: RABBITMQ_HOST
              value: rabbitmq-client.aisafe.svc.cluster.local
            - name: RABBITMQ_USERNAME
              value: login
            - name: RABBITMQ_PASSWORD
              valueFrom: { secretKeyRef: { name: aisafe-rabbitmq, key: login-password } }
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests: { memory: 320Mi, cpu: 100m }
            limits: { memory: 512Mi }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 8085 }
            periodSeconds: 5
            failureThreshold: 200
            timeoutSeconds: 3
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8085 }
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8085 }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          # Keep answering for 5 s after being told to stop: the virtual IPs take a moment to stop
          # sending requests here, and those requests would otherwise fail.
          lifecycle:
            preStop:
              sleep: { seconds: 5 }
  # The same disks as aircraft-maintenance (see there).
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests: { storage: 1Gi }
---
# ===================== entry (one per VM) =====================
# Envoy, configured by envoy.yaml (ConfigMap "entry", created by deploy.sh). Without it, requests
# keep going to the replicas of a VM that just died until k3s notices (~20 s).
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: entry
  namespace: aisafe
spec:
  selector:
    matchLabels:
      app: entry
  template:
    metadata:
      labels:
        app: entry
      annotations:
        # Restarts the entries when envoy.yaml or their certificate changes
        aisafe/config: "@ENTRY_CONFIG_HASH@"
    spec:
      terminationGracePeriodSeconds: 15
      containers:
        - name: envoy
          image: envoyproxy/envoy:v1.35.0
          # Request logs written within 250 ms (default: 10 s), for the demo dashboard
          args: [-c, /etc/envoy/envoy.yaml, --log-level, warn, --file-flush-interval-msec, "250"]
          ports:
            - containerPort: 10081
            - containerPort: 10082
            - containerPort: 10441
            - containerPort: 10442
            - containerPort: 10443
            - containerPort: 10445
            - containerPort: 10446
          volumeMounts:
            - name: config
              mountPath: /etc/envoy
            - name: tls
              mountPath: /etc/entry-tls
              readOnly: true
          resources:
            requests: { memory: 48Mi, cpu: 50m }
            limits: { memory: 128Mi }
          readinessProbe:
            tcpSocket: { port: 10081 }
            periodSeconds: 3
          # As for the services: keep answering while the virtual IP moves to another VM.
          lifecycle:
            preStop:
              sleep: { seconds: 5 }
      volumes:
        - name: config
          configMap:
            name: entry
        - name: tls
          secret:
            secretName: entry-tls
