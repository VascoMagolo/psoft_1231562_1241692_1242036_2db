# AISafe on k3s: the services, their virtual IPs (MetalLB), the entry of each node (Envoy) and one
# port per replica for tests. Applied by deploy/setup.sh, which fills in the @...@ values from
# deploy/config.sh. The JWT secret (aisafe-jwt), the entries' certificate (entry-tls) and the
# RabbitMQ passwords (aisafe-rabbitmq) are created by setup.sh, never stored here. RabbitMQ itself
# is in rabbitmq.yaml.
#
# Virtual IPs (HTTPS, port 443), through the entry of the node that announces them:
#   @VIP_AIRCRAFT_MAINTENANCE@ aircraft-maintenance   @VIP_AIRPORTS_ROUTES@ airports-routes   @VIP_FLIGHT_OPS@ flight-ops   @VIP_LOGIN@ login
# One port per replica, on any node:
#   30810-30812 aircraft-maintenance-0..2   30820-30822 airports-routes-0..2   30830-30832 flight-ops-0..2
apiVersion: v1
kind: Namespace
metadata:
  name: aisafe
---
# ===================== aircraft-maintenance =====================
# Stable replica names (aircraft-maintenance-0.aircraft-maintenance...): node ids and peer list.
apiVersion: v1
kind: Service
metadata:
  name: aircraft-maintenance
  namespace: aisafe
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: aircraft-maintenance
  ports:
    - name: http
      port: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: aircraft-maintenance-vip
  namespace: aisafe
  annotations:
    metallb.io/loadBalancerIPs: "@VIP_AIRCRAFT_MAINTENANCE@"
spec:
  type: LoadBalancer
  # The VM that announces the virtual IP handles its requests with its own entry (below).
  externalTrafficPolicy: Local
  selector:
    app: entry
  ports:
    - name: https
      port: 443
      targetPort: 10441
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: aircraft-maintenance
  namespace: aisafe
spec:
  serviceName: aircraft-maintenance
  replicas: 3
  podManagementPolicy: Parallel
  # A deploy restarts the next replica only 10 s after the previous one is ready, so every peer
  # has seen it back (its startup sync reaches them) before another one stops.
  minReadySeconds: 10
  selector:
    matchLabels:
      app: aircraft-maintenance
  template:
    metadata:
      labels:
        app: aircraft-maintenance
    spec:
      # One replica per VM when possible; "preferred" so a replica can be reborn on another VM.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: aircraft-maintenance
      # By default k3s waits 5 minutes before moving pods off a VM that stopped answering.
      tolerations:
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
      # preStop below + Spring's graceful shutdown (requests in progress finish).
      terminationGracePeriodSeconds: 25
      containers:
        - name: app
          image: "@IMAGE_PREFIX@/aircraft-maintenance:@IMAGE_TAG@"
          imagePullPolicy: "@IMAGE_PULL_POLICY@"
          ports:
            - containerPort: 8081
          env:
            # A replica that restarts gets a new address: look peers up again after 1 s instead of
            # the JVM's 30 s, or requests keep going to the old address and time out.
            - name: JAVA_TOOL_OPTIONS
              value: -Dsun.net.inetaddr.ttl=1 -Dsun.net.inetaddr.negative.ttl=0 -XX:TieredStopAtLevel=1 -Xmx320m
            - name: NODE_ID
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            # Every replica, including this one: each replica leaves itself out (by its node id).
            - name: PEERS
              value: >-
                http://aircraft-maintenance-0.aircraft-maintenance.aisafe.svc.cluster.local:8081,
                http://aircraft-maintenance-1.aircraft-maintenance.aisafe.svc.cluster.local:8081,
                http://aircraft-maintenance-2.aircraft-maintenance.aisafe.svc.cluster.local:8081
            - name: SEED_NODE
              value: aircraft-maintenance-0
            # Refuse new requests 3 s before stopping: the entries check readiness every second.
            - name: DRAIN_MS
              value: "3000"
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: aisafe-jwt, key: secret } }
            # Database on the replica's own disk (volume "data" below). Closed by Spring when it stops,
            # not by H2 as soon as the replica is told to stop: requests still being answered need it.
            - name: DB_URL
              value: jdbc:h2:file:/data/aircraft-maintenance;DB_CLOSE_ON_EXIT=FALSE
            # The audit trail (who did what, with what result), next to the database
            - name: AISAFE_AUDIT_FILE
              value: /data/audit.log
            # Events, read models and commands on RabbitMQ (Assignment 2), with this service's own user
            - name: EVENTS_ENABLED
              value: "true"
            - name: RABBITMQ_HOST
              value: rabbitmq-client.aisafe.svc.cluster.local
            - name: RABBITMQ_USERNAME
              value: aircraft-maintenance
            - name: RABBITMQ_PASSWORD
              valueFrom: { secretKeyRef: { name: aisafe-rabbitmq, key: aircraft-maintenance-password } }
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests: { memory: 384Mi, cpu: 100m }
            limits: { memory: 640Mi }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 8081 }
            periodSeconds: 5
            failureThreshold: 200
            timeoutSeconds: 3
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8081 }
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8081 }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          # Keep answering for 5 s after being told to stop: the virtual IPs take a moment to stop
          # sending requests here, and those requests would otherwise fail.
          lifecycle:
            preStop:
              sleep: { seconds: 5 }
  # Each replica keeps its disk on its VM's disk (k3s local-path): restarting or deleting the
  # replica keeps the data, so a replica only recovers from its peers when its disk is new.
  # The disk stays on its VM: when a VM does not come back, the vigia (deploy/vigia/) deletes
  # the disk so the replica is reborn, empty, on another VM and recovers from its peers.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests: { storage: 1Gi }
---
# One port per replica, so tests can choose the replica ("instance1", "instance2", ...).
apiVersion: v1
kind: Service
metadata:
  name: aircraft-maintenance-0
  namespace: aisafe
spec:
  type: NodePort
  selector:
    statefulset.kubernetes.io/pod-name: aircraft-maintenance-0
  ports:
    - port: 8081
      nodePort: 30810
---
apiVersion: v1
kind: Service
metadata:
  name: aircraft-maintenance-1
  namespace: aisafe
spec:
  type: NodePort
  selector:
    statefulset.kubernetes.io/pod-name: aircraft-maintenance-1
  ports:
    - port: 8081
      nodePort: 30811
---
apiVersion: v1
kind: Service
metadata:
  name: aircraft-maintenance-2
  namespace: aisafe
spec:
  type: NodePort
  selector:
    statefulset.kubernetes.io/pod-name: aircraft-maintenance-2
  ports:
    - port: 8081
      nodePort: 30812
