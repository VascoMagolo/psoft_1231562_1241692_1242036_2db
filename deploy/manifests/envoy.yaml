                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                      # And one per attempt: a replica that failed before another one answered.
                      upstream_log:
                        - name: envoy.access_loggers.stdout
                          typed_config:
                            "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                            log_format: { json_format: { k: "attempt", svc: "airports-routes", t: "%START_TIME(%Y-%m-%dT%H:%M:%S.%3fZ)%", corr: "%REQ(X-CORRELATION-ID)%", rid: "%REQ(X-REQUEST-ID)%", m: "%REQ(:METHOD)%", p: "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%", code: "%RESPONSE_CODE%", flags: "%RESPONSE_FLAGS%", up: "%UPSTREAM_HOST%", n: "%UPSTREAM_REQUEST_ATTEMPT_COUNT%", ms: "%DURATION%", from: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%" } }
                route_config:
                  virtual_hosts:
                    - name: airports-routes
