                                host_selection_retry_max_attempts: 3
                          # Logging in changes nothing: safe to repeat, as a read.
                          - match: { path: /api/auth/login }
                            route:
                              cluster: login
                              timeout: 60s
                              retry_policy:
                                retry_on: connect-failure,refused-stream,reset,gateway-error,retriable-status-codes
                                retriable_status_codes: [500]
                                num_retries: 2
                                per_try_timeout: 5s
                                retry_host_predicate:
