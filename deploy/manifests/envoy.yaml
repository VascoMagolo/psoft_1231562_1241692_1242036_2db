    - name: login
      # Every replica, from the service with their stable names, looked up every second.
      cluster_type:
        name: envoy.cluster.dns
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.clusters.dns.v3.DnsCluster
          dns_refresh_rate: 1s
          respect_dns_ttl: false
      connect_timeout: 0.5s
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: login
        endpoints:
          - lb_endpoints:
              - endpoint: { address: { socket_address: { address: login.aisafe.svc.cluster.local, port_value: 8085 } } }
      # Only replicas that say they are ready get requests: one that stops answering is left out
      # after ~2 s, without waiting for k3s to notice that its VM is gone.
      health_checks:
        - timeout: 0.5s
          interval: 1s
          unhealthy_threshold: 2
          healthy_threshold: 1
          http_health_check: { path: /actuator/health/readiness }
      # Never send requests to replicas known to be down, even when most of them are.
      common_lb_config: { healthy_panic_threshold: { value: 0 } }
    - name: rabbitmq
      # The management API of any ready broker (the rabbitmq-client service).
      cluster_type:
        name: envoy.cluster.dns
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.clusters.dns.v3.DnsCluster
          dns_refresh_rate: 5s
          respect_dns_ttl: false
      connect_timeout: 1s
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: rabbitmq
        endpoints:
          - lb_endpoints:
              - endpoint: { address: { socket_address: { address: rabbitmq-client.aisafe.svc.cluster.local, port_value: 15672 } } }
