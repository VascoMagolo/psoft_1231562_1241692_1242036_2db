    # HTTPS: the RabbitMQ management console and API (users of RabbitMQ itself, see rabbitmq.yaml),
    # for the Postman tests of the events and to watch the queues during a demonstration.
    - name: rabbitmq
      address: { socket_address: { address: 0.0.0.0, port_value: 10446 } }
      filter_chains:
        - transport_socket: *tls
          filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: rabbitmq
                use_remote_address: true
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                route_config:
                  virtual_hosts:
                    - name: rabbitmq
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: rabbitmq, timeout: 30s }
  clusters:
    - name: aircraft-maintenance
      # Every replica, from the service with their stable names, looked up every second.
      cluster_type:
        name: envoy.cluster.dns
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.clusters.dns.v3.DnsCluster
          dns_refresh_rate: 1s
          respect_dns_ttl: false
      connect_timeout: 0.5s
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: aircraft-maintenance
        endpoints:
          - lb_endpoints:
              - endpoint: { address: { socket_address: { address: aircraft-maintenance.aisafe.svc.cluster.local, port_value: 8081 } } }
      # Only replicas that say they are ready get requests: one that stops answering is left out
      # after ~2 s, without waiting for k3s to notice that its VM is gone.
      health_checks:
        - timeout: 0.5s
          interval: 1s
          unhealthy_threshold: 2
          healthy_threshold: 1
          http_health_check: { path: /actuator/health/readiness }
      # Never send requests to replicas known to be down, even when most of them are.
      common_lb_config: { healthy_panic_threshold: { value: 0 } }
