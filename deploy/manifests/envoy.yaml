# Configuration of the entry (Envoy), one per VM: each virtual IP leads to the entry of the VM
# that announces it, which sends each request to a ready replica and, when that replica does not
# answer, to another one. Loaded into the ConfigMap "entry" by deploy/setup.sh.
# HTTPS, behind the virtual IPs (certificate in the Secret "entry-tls", made by deploy/setup.sh):
#   10441 -> aircraft-maintenance replicas   10442 -> airports-routes replicas   10443 -> flight-ops replicas   10445 -> logins
#   10446 -> RabbitMQ management (console and API)
# Plain HTTP, only for the services' calls from inside the cluster (aircraft-maintenance-local, airports-routes-local):
#   10081 -> aircraft-maintenance replicas   10082 -> airports-routes replicas
static_resources:
  listeners:
    - name: aircraft-maintenance
      address: { socket_address: { address: 0.0.0.0, port_value: 10081 } }
      filter_chains:
        - filters: &aircraft_maintenance
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: aircraft-maintenance
                use_remote_address: true
                # One JSON line per request, for the demo dashboard (deploy/dashboard/): which replica
                # answered, after how many attempts, and the request's correlation id.
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format: { json_format: { k: "request", svc: "aircraft-maintenance", t: "%START_TIME(%Y-%m-%dT%H:%M:%S.%3fZ)%", corr: "%REQ(X-CORRELATION-ID)%", rid: "%REQ(X-REQUEST-ID)%", m: "%REQ(:METHOD)%", p: "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%", code: "%RESPONSE_CODE%", flags: "%RESPONSE_FLAGS%", up: "%UPSTREAM_HOST%", n: "%UPSTREAM_REQUEST_ATTEMPT_COUNT%", ms: "%DURATION%", from: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%" } }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                      # And one per attempt: a replica that failed before another one answered.
                      upstream_log:
                        - name: envoy.access_loggers.stdout
                          typed_config:
                            "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                            log_format: { json_format: { k: "attempt", svc: "aircraft-maintenance", t: "%START_TIME(%Y-%m-%dT%H:%M:%S.%3fZ)%", corr: "%REQ(X-CORRELATION-ID)%", rid: "%REQ(X-REQUEST-ID)%", m: "%REQ(:METHOD)%", p: "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%", code: "%RESPONSE_CODE%", flags: "%RESPONSE_FLAGS%", up: "%UPSTREAM_HOST%", n: "%UPSTREAM_REQUEST_ATTEMPT_COUNT%", ms: "%DURATION%", from: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%" } }
                route_config:
                  virtual_hosts:
                    - name: aircraft-maintenance
                      domains: ["*"]
                      # The replicas log the request under the same id (X-Correlation-Id) as this entry.
                      request_headers_to_add:
                        - header: { key: X-Correlation-Id, value: "%REQ(X-REQUEST-ID)%" }
                          append_action: ADD_IF_ABSENT
                      routes:
                          # Through the virtual IPs (HTTPS) clients reach only the API: the routes between
                          # services and replicas (/internal) and the database console answer 404. The calls
                          # from inside the cluster come in plain HTTP (10081, 10082) and still pass.
                          - match: { prefix: "/internal", headers: [{ name: x-forwarded-proto, string_match: { exact: https } }] }
                            direct_response: { status: 404 }
                          - match: { prefix: "/h2-console" }
                            direct_response: { status: 404 }
                          - match: { prefix: "/", headers: [{ name: ":method", string_match: { exact: GET } }] }
                            route:
                              cluster: aircraft-maintenance
                              timeout: 60s
                              retry_policy:
                                # A read is safe to repeat: also when the replica fails (502-504) or takes too long.
                                retry_on: connect-failure,refused-stream,reset,gateway-error
                                num_retries: 2
                                per_try_timeout: 5s
                                retry_host_predicate:
                                  - name: envoy.retry_host_predicates.previous_hosts
                                    typed_config:
                                      "@type": type.googleapis.com/envoy.extensions.retry.host.previous_hosts.v3.PreviousHostsPredicate
                                host_selection_retry_max_attempts: 3
                          - match: { prefix: "/" }
                            route:
                              cluster: aircraft-maintenance
                              timeout: 60s
                              retry_policy:
                                # A write is repeated only when it never reached the replica.
                                retry_on: connect-failure,refused-stream
                                num_retries: 2
                                retry_host_predicate:
                                  - name: envoy.retry_host_predicates.previous_hosts
                                    typed_config:
                                      "@type": type.googleapis.com/envoy.extensions.retry.host.previous_hosts.v3.PreviousHostsPredicate
                                host_selection_retry_max_attempts: 3
    # The same with HTTPS, behind the virtual IP; the one above is for calls from inside the cluster.
    - name: aircraft-maintenance-https
      address: { socket_address: { address: 0.0.0.0, port_value: 10441 } }
